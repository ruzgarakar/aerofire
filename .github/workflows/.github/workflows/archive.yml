name: archive-update

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extend archive and build tr_year.json
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
        run: python scripts/archive_update.py
      - name: Commit if changed
        run: |
          git config user.name "aerofire-bot"
          git config user.email "aerofire-bot@users.noreply.github.com"
          git add web/data/tr_year.json data/processed/tr_archive.csv
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "daily archive update"
            git pull --rebase origin main
            git push
          fi
