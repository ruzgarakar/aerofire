name: live-update

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NASA FIRMS data and build live.json
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
        run: python scripts/live_update.py
      - name: Commit if changed
        run: |
          git config user.name "aerofire-bot"
          git config user.email "aerofire-bot@users.noreply.github.com"
          git add web/data/live.json data/processed/live_points.csv
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "live data update"
            git pull --rebase origin main
            git push
          fi
